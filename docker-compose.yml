services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecoclock-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_NAME=EcoClock AI
      - API_PREFIX=/api/v1
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=ecoclock_secure_pass_2026
      - NEO4J_READONLY_USERNAME=neo4j_readonly
      - NEO4J_READONLY_PASSWORD=ecoclock_ro_pass_2026
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=mistral
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - CLIMATE_TARGET_DATE=2040-12-31
      - BASELINE_YEAR=2024
      - SYNTHETIC_DATA_SEED=42
      - USE_SYNTHETIC_DATA=true
      - DATABASE_URL=sqlite:////app/data/ecoclock.db
    volumes:
      - backend_data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecoclock-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

  neo4j:
    image: neo4j:5.17.0-community
    container_name: ecoclock-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/ecoclock_secure_pass_2026
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    container_name: ecoclock-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  backend_data:
  neo4j_data:
  neo4j_logs:
  ollama_models:

